services:
  ollama:
    image: ollama/ollama:latest
    container_name: local_llm_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: generative_agents_app
    ports:
      - "8000:8000"
    volumes:
      - ./generative_agents:/app
    working_dir: /app/environment/frontend_server  # ← ここを追加
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/environment/frontend_server:/app/reverie/backend_server
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=qwen3.5:4b
    command: python manage.py runserver 0.0.0.0:8000  # ← コマンドを直接指定
    depends_on:
      - ollama
    tty: true
    stdin_open: true

volumes:
  ollama_storage:
