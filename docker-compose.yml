version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: local_llm_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: generative_agents_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=qwen3.5:3b-instruct
    depends_on:
      - ollama
    tty: true
    stdin_open: true

volumes:
  ollama_storage:
